<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>cloudkeep — gateway</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-view="login">
    <header class="site-header">
        <div class="container">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">&#9635;</span>
                <span class="brand-name">cloudkeep</span>
            </a>
            <button class="btn btn--ghost" id="logout" type="button" hidden>Sign out</button>
        </div>
    </header>

    <main class="container" id="main">
        <!-- LOGIN -->
        <section id="view-login" class="view">
            <div class="auth-card">
                <h1 class="auth-title">Sign in</h1>
                <form id="login-form" class="auth-form" autocomplete="off">
                    <label class="field">
                        <span class="field-label">username</span>
                        <input class="field-input" id="username" name="username" type="text" required autofocus>
                    </label>
                    <label class="field">
                        <span class="field-label">password</span>
                        <input class="field-input" id="password" name="password" type="password" required>
                    </label>
                    <button class="btn" id="submit" type="submit">Sign in</button>
                    <p class="form-error" id="login-error" role="alert" hidden></p>
                </form>
            </div>
        </section>

        <!-- DASHBOARD -->
        <section id="view-dashboard" class="view" hidden>
            <header class="section-header section-header--row">
                <h2 class="section-title">Your machines</h2>
                <button class="btn" id="build-toggle" type="button">Build a machine</button>
            </header>

            <!-- BUILDER -->
            <section id="builder" class="builder" hidden>
                <form id="builder-form" class="builder-form" autocomplete="off">
                    <label class="field">
                        <span class="field-label">name</span>
                        <input class="field-input" id="vm-label" maxlength="40" placeholder="my-desktop" required>
                    </label>
                    <label class="field">
                        <span class="field-label">vCPUs · <span id="out-vcpus">1</span></span>
                        <input class="slider" id="in-vcpus" type="range">
                    </label>
                    <label class="field">
                        <span class="field-label">memory · <span id="out-mem">1</span> GB</span>
                        <input class="slider" id="in-mem" type="range">
                    </label>
                    <label class="field">
                        <span class="field-label">disk · <span id="out-disk">16</span> GB</span>
                        <input class="slider" id="in-disk" type="range">
                    </label>
                    <p class="builder-avail" id="builder-avail"></p>
                    <button class="btn" id="build-submit" type="submit">Provision</button>
                    <p class="form-error" id="builder-error" role="alert" hidden></p>
                </form>
            </section>

            <div class="card-grid" id="vm-list"></div>
            <p class="empty" id="vm-empty" hidden>No machines yet. Build one to get started.</p>
            <p class="form-error" id="dashboard-error" role="alert" hidden></p>
        </section>
    </main>

    <!-- VIEWER (full-bleed) -->
    <section id="view-viewer" class="view view-viewer" hidden>
        <div class="viewer-bar">
            <span class="brand-mark" aria-hidden="true">&#9635;</span>
            <span id="status" class="viewer-status">Connecting&hellip;</span>
            <button class="btn btn--ghost" id="disconnect" type="button">Disconnect</button>
        </div>
        <div id="screen" class="viewer-screen"></div>
    </section>

    <script type="module" src="/assets/app.js"></script>
</body>
</html>
